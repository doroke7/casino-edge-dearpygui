version: v2
clean: true
managed:
  enabled: true
  disable:
    - module: buf.build/googleapis/googleapis
  override:
    - file_option: go_package_prefix
      value: github.com/wegdevio/pk-studio-reader/pkg/api

plugins:
  # Python - 生成 protobuf message
  - remote: buf.build/protocolbuffers/python
    out: pb

  # Python gRPC - 生成 gRPC stub
  - remote: buf.build/grpc/python
    out: pb

