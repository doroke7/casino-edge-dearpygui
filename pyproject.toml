[project]
name = "landan-desktop-dearpygui"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "click>=8.1.0",
    "dearpygui>=2.3.1",
    "grpcio>=1.80.0",
    "protobuf>=6.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "pyobjc-framework-avfoundation>=12.2.2 ; sys_platform == 'darwin'",
    "pyobjc-framework-cocoa>=12.2.2 ; sys_platform == 'darwin'",
    "pyobjc-framework-quartz>=12.2.2 ; sys_platform == 'darwin'",
    "dependency-injector>=4.49.1",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "openvino>=2026.4.0",
    "opencv-python-headless>=5.0.0.93",
]

[dependency-groups]
dev = [
    "poethepoet>=0.30.0",
]

# 與 Makefile 同步的任務，使用方式： uv run poe <task>
[tool.poe.tasks]
submodule = { shell = """
git submodule sync --recursive
git submodule update --init --recursive --remote
""" }

init = { shell = """
rm -Rf .venv
uv venv .venv --python 3.14
uv venv --seed
""" }

install = "uv sync"
dev = "uv run python main.py all -v"
start = "uv run python main.py all -v"
desktop = "uv run python main.py desktop"
recognition = "uv run python main.py recognition"

# 生成 pb 後全局替換 import 路徑（見 Makefile 註解 2-a）
buf = { shell = '''
buf generate proto --template buf.gen.yaml
find pb -name '*_pb2*.py' -exec sed -i '' -E \
  -e 's/^from (recognition|resource|facade|source)\./from pb.\1./' \
  -e 's/^from (recognition|resource|facade|source) import/from pb.\1 import/' \
  -e 's/^from common import/from pb import/' \
  -e 's/^import common_pb2 as/from pb import common_pb2 as/' \
  {} +
''' }

clean = "rm -rf .venv ./dist build *.egg-info"
